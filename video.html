<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Memories</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(rgba(0, 0, 0, 0.4), rgba(0, 0, 0, 0.4)), 
                        url('IMG-20260526-WA0992.jpg') no-repeat center center fixed;
            background-size: cover;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #333;
            padding: 40px 0;
        }

        .container {
            text-align: center;
            background: rgba(255, 255, 255, 0.92);
            padding: 35px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3);
            max-width: 1000px; /* Widened slightly to fit two videos nicely */
            width: 90%;
            backdrop-filter: blur(5px);
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            color: #2d3748;
            letter-spacing: 1px;
        }

        p {
            font-size: 1.1rem;
            color: #4a5568;
            margin-bottom: 25px;
            font-weight: 500;
        }

        /* Responsive Grid layout for two videos */
        .video-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .video-wrapper {
            position: relative;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
            background: #000;
        }

        video {
            width: 100%;
            display: block;
        }

        /* Button Navigation Styling */
        .btn-container {
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
            margin-top: 20px;
        }

        .btn-container a {
            text-decoration: none;
            padding: 12px 24px;
            font-weight: 600;
            border-radius: 30px;
            transition: all 0.3s ease;
            font-size: 0.95rem;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }

        .shayari-btn {
            background-color: #e53e3e;
            color: white;
        }

        .shayari-btn:hover {
            background-color: #c53030;
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(229, 62, 62, 0.4);
        }

        .video-btn {
            background-color: #3182ce;
            color: white;
        }

        .video-btn:hover {
            background-color: #2b6cb0;
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(49, 130, 206, 0.4);
        }

        .memories-btn {
            background-color: #319795;
            color: white;
        }

        .memories-btn:hover {
            background-color: #2c7a7b;
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(49, 151, 149, 0.4);
        }

        .footer {
            margin-top: 30px;
            font-size: 0.95rem;
            color: #718096;
            font-weight: bold;
            border-top: 1px solid rgba(0,0,0,0.1);
            padding-top: 15px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>My Beautiful Memories</h1>
        <p>A collection of moments worth keeping on repeat ✨</p>
        
        <div class="video-grid">
            <div class="video-wrapper">
                <video controls autoplay loop muted>
                    <source src="VID-20260526-WA0294.mp4" type="video/mp4">
                    Your browser does not support the video tag.
                </video>
            </div>

            <div class="video-wrapper">
                <video controls autoplay loop muted>
                    <source src="VID-20260526-WA0298.mp4" type="video/mp4">
                    Your browser does not support the video tag.
                </video>
            </div>
        </div>

        <div class="btn-container">
            <a href="shayari.html" id="toShayari" class="shayari-btn">Read My Shayari</a>
        
            <a href="combain.html" id="toCombain" class="memories-btn">See All Memories</a>
        </div>

        <div class="footer">
            Made with ❤️ | Playing on Loop
        </div>
    </div>

</body>
</html>
