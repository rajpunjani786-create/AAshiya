name: CI Build and Package

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    name: Build and Package
    runs-on: ubuntu-latest
    outputs:
      hashes: ${{ steps: hash.outputs.hashes }} # Required if passing data to provenance

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Standard install and build steps
      - name: Install Dependencies
        run: npm install

      - name: Run Build
        run: npm run build --if-present

      # Example step that generates hashes for the provenance generator to verify
      - name: Generate Hashes
        id: hash
        run: |
          echo "hashes=$(sha256sum dist/* | base64 -w0)" >> $GITHUB_OUTPUT

  # THIS IS THE JOB CAUSING YOUR ERROR: Update the 'uses' line here
  provenance:
    needs: [build]
    permissions:
      id-token: write   # Required for keyless signing
      contents: read     # Required to read code
      actions: read      # Required to read workflow runs
    # FIXED: Upgraded the shared template version so it stops using the deprecated v3 artifact action
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.0.0
    with:
      base64-subjects: "${{ needs.build.outputs.hashes }}"
      upload-assets: true
