name: CI Build and Provenance

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    name: Build and Package
    runs-on: ubuntu-latest

    steps:
      # 1. Fixed: Kept up-to-date with modern Node runner environments
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Setup Node.js (Upgraded to Node 22 to clear out Node 20 deprecation warnings)
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Build
        run: npm run build --if-present

      # 3. Fixed: Replaced deprecated 'set-output' syntax with modern environment files
      - name: Detect Environment (Provenance Setup)
        id: detect-env
        run: |
          echo "Current environment configuration..."
          echo "env_name=production" >> $GITHUB_OUTPUT
          echo "build_time=$(date +'%Y-%m-%d')" >> $GITHUB_OUTPUT

      # 4. Fixed: Upgraded from the deprecated commit hash to the stable v4 release
      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: production-assets
          path: |
            dist/
            build/
          retention-days: 5
