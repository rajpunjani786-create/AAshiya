name: SLSA generic generator
on:
  workflow_dispatch:

permissions:
  id-token: write    # Required for OIDC signing
  contents: read     # Required to read repository contents

jobs:
  build:
    runs-on: ubuntu-latest
    # 1. This block links the step output below to the global job outputs
    outputs:
      hashes: ${{ steps.share-hashes.outputs.hashes }}
    steps:
      - uses: actions/checkout@v4

      # Step 1: Create the files
      - name: Build artifacts
        run: |
            echo "artifact1" > artifact1
            echo "artifact2" > artifact2

      # Step 2: Generate the cryptographic hashes and set them to outputs
      # This is the exact step that prevents Exit Code 27
      @id: share-hashes
      - name: Generate hashes
        id: share-hashes
        run: |
            echo "hashes=$(sha256sum artifact* | base64 -w0)" >> "$GITHUB_OUTPUT"

      # Step 3: Save the files on GitHub
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: my-build-artifacts
          path: artifact*

  provenance:
    needs: [build]
    # Uses the stable, up-to-date version of the SLSA generator
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.0.0
    with:
      # 2. This explicitly hands over the artifact hashes to the generator
      base64-subjects: "${{ needs.build.outputs.hashes }}"
      upload-assets: false
