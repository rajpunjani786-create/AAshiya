name: CI Build and Provenance

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    name: Build and Package
    runs-on: ubuntu-latest
    outputs:
      hashes: ${{ steps.hash.outputs.hashes }}

    steps:
      # 1. Checkout your source repository
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Modern Node environment setup
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # 3. Safe installation (works even if package-lock.json is missing)
      - name: Install Dependencies
        run: npm install

      # 4. Build step
      - name: Run Build
        run: npm run build --if-present

      # 5. Generates the safe outputs for the provenance generator below
      - name: Generate Hashes
        id: hash
        run: |
          mkdir -p dist build
          echo "hashes=$(sha256sum dist/* build/* 2>/dev/null | base64 -w0)" >> "$GITHUB_OUTPUT"

  # THIS IS THE EXACT JOB THAT WAS FAILING:
  # Upgrading this to @v2.1.0 bypasses the blocked artifact upload tools entirely.
  provenance:
    needs: [build]
    permissions:
      id-token: write   # Required for security token generation
      contents: read     # Required to read repository file structures
      actions: read      # Required to check execution states
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0
    with:
      base64-subjects: "${{ needs.build.outputs.hashes }}"
      upload-assets: true
