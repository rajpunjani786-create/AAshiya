name: SLSA generic generator
on:
  workflow_dispatch:

# These must be set globally at the top level
permissions:
  id-token: write    # Crucial for fixing Exit Code 27
  contents: write    # Required to attach the provenance to your releases/tags
  actions: read      # Required to download workflow metadata

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      hashes: ${{ steps.share-hashes.outputs.hashes }}
    steps:
      - uses: actions/checkout@v4

      # Step 1: Create the files
      - name: Build artifacts
        run: |
            echo "artifact1" > artifact1
            echo "artifact2" > artifact2

      # Step 2: Generate the base64 subject hashes required by SLSA
      - name: Generate hashes
        id: share-hashes
        run: |
            echo "hashes=$(sha256sum artifact* | base64 -w0)" >> "$GITHUB_OUTPUT"

      # Step 3: Save the files securely on GitHub
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: my-build-artifacts
          path: artifact*

  # Step 4: The actual SLSA generator that consumes your hashes
  provenance:
    needs: [build]
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.0.0
    with:
      base64-subjects: "${{ needs.build.outputs.hashes }}"
      upload-assets: false
