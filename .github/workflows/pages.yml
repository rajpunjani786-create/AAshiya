name: CI Build, Package, and Provenance

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    name: Build and Package
    runs-on: ubuntu-latest
    outputs:
      hashes: ${{ steps.hash.outputs.hashes }}

    steps:
      # 1. Standard Code Checkout
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Modern Node Environment to address Node 20 deprecation warnings
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # 3. Safe installation if your repository is missing a lockfile
      - name: Install Dependencies
        run: npm install

      - name: Run Build
        run: npm run build --if-present

      # 4. Generate the cryptographic hashes needed for the SLSA generator
      - name: Generate Hashes
        id: hash
        run: |
          # Creates hashes of your distribution assets and safely pipes to modern GITHUB_OUTPUT
          cd dist 2>/dev/null || cd build 2>/dev/null || mkdir dist
          echo "hashes=$(sha256sum * 2>/dev/null | base64 -w0)" >> "$GITHUB_OUTPUT"

  # THIS JOB GENERATES THE PROVENANCE ATTESTATION
  provenance:
    needs: [build]
    permissions:
      id-token: write   # Required for keyless OIDC signing
      contents: read     # Required to read repository info
      actions: read      # Required to evaluate workflow metrics
    
    # FIXED: Swapped out old v1 tags for v2.1.0, which stops pulling the deprecated v3 artifact upload code
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0
    with:
      base64-subjects: "${{ needs.build.outputs.hashes }}"
      upload-assets: true
