name: SLSA generic generator
on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: write
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      hashes: ${{ steps.share-hashes.outputs.hashes }}
    steps:
      - uses: actions/checkout@v4

      - name: Build artifacts
        run: |
            echo "artifact1" > artifact1
            echo "artifact2" > artifact2

      # The SLSA generator requires the SHA256 hashes to be generated EXACTLY like this
      - name: Generate hashes
        id: share-hashes
        run: |
            echo "hashes=$(sha256sum artifact* | base64 -w0)" >> "$GITHUB_OUTPUT"

      # Optional but recommended to ensure the files are retained
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: my-build-artifacts
          path: artifact*

  provenance:
    needs: [build]
    # CRITICAL: Using v2.0.0 bypasses the internal Sigstore TUF mirror bugs found in v1.x.x
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.0.0
    with:
      base64-subjects: "${{ needs.build.outputs.hashes }}"
      upload-assets: false
