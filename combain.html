<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aashiya - Video Memories</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background-image: url('IMG-20260526-WA0684.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            background-color: #ffffff;
            font-family: 'Arial', sans-serif;
            color: #ffffff;
            text-align: center;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
            text-shadow: 2px 2px 8px rgba(0, 0, 0, 0.7);
        }
        .content {
            background: rgba(15, 32, 23, 0.75);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 40px 30px;
            border-radius: 20px;
            max-width: 900px;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.5);
        }
        h1 {
            font-size: 2.8rem;
            margin-bottom: 10px;
            letter-spacing: 2px;
            color: #dfc15d;
        }
        .subtitle {
            font-size: 1.1rem;
            margin-bottom: 35px;
            color: #cccccc;
        }
        
        /* Video Grid Layout */
        .video-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 25px;
            width: 100%;
            margin-bottom: 40px;
        }
        .video-wrapper {
            position: relative;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.4);
            background: #000;
            border: 2px solid rgba(223, 193, 93, 0.3);
            transition: transform 0.3s ease;
        }
        .video-wrapper:hover {
            transform: scale(1.02);
            border-color: #dfc15d;
        }
        video {
            width: 100%;
            display: block;
        }

        /* Navigation Buttons Layout */
        .btn-container {
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
            width: 100%;
            margin-top: 10px;
        }

        .btn-container a {
            text-decoration: none;
            padding: 12px 28px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 25px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            display: inline-block;
        }

        /* Go Back / Home button specific layout styling */
        .back-btn {
            background: linear-gradient(45deg, #1b4d3e, #2d6a4f);
            border: 1px solid #dfc15d;
            color: #ffffff;
        }
        .back-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(223, 193, 93, 0.4);
            background: linear-gradient(45deg, #2d6a4f, #1b4d3e);
        }

        /* Shayari Button styling */
        .shayari-btn {
            background: linear-gradient(45deg, #721c24, #a92330);
            border: 1px solid #dfc15d;
            color: #ffffff;
        }
        .shayari-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(223, 193, 93, 0.4);
            background: linear-gradient(45deg, #a92330, #721c24);
        }

        /* See All Memories Button styling */
        .memories-btn {
            background: linear-gradient(45deg, #946f19, #dfc15d);
            border: 1px solid #ffffff;
            color: #0f2017;
        }
        .memories-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 255, 255, 0.3);
            background: linear-gradient(45deg, #dfc15d, #946f19);
            color: #ffffff;
        }
    </style>
</head>
<body>

    <div class="content">
        <h1>Moments on Repeat</h1>
        <p class="subtitle">Cherished video memories kept alive forever ✨</p>
        
        <!-- Video Grid -->
        <div class="video-grid">
            <div class="video-wrapper">
                <video controls autoplay loop muted>
                    <source src="VID-20260529-WA0041.mp4" type="video/mp4">
                    Your browser does not support the video tag.
                </video>
            </div>

            <div class="video-wrapper">
                <video controls autoplay loop muted>
                    <source src="VID_20260526_095422_651.mp4" type="video/mp4">
                    Your browser does not support the video tag.
                </video>
            </div>
        </div>

        <!-- Navigation Buttons Container -->
        <div class="btn-container">
            <a href="aashya camp .html" class="back-btn">← Go Back Home</a>
            <a href="shayari.html" class="shayari-btn">Read My Shayari</a>
            
        </div>
    </div>

</body>
</html>
